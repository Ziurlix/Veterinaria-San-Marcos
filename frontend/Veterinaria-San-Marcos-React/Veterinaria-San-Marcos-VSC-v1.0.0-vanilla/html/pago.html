<!DOCTYPE html>
<html lang="es">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpay Plus - Pago Seguro</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background-color: #f4f6f8; }
        .webpay-header { background-color: #d11241; color: white; padding: 15px 0; text-align: center; font-weight: bold; font-size: 1.5rem; }
        .pago-card { max-width: 500px; margin: 40px auto; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); padding: 30px; }
        .precio-destacado { font-size: 2rem; color: #123e32; font-weight: bold; text-align: center; margin: 20px 0; }
        .loader { display: none; text-align: center; margin-top: 20px; }
    </style>
</head>


<body>

    <div class="webpay-header">
        Webpay Plus (Simulación)
    </div>

    <div class="container">
        <div class="pago-card">
            <h4 class="text-center mb-4">Detalle de Pago</h4>
            
            <ul class="list-group list-group-flush mb-4" id="detalleCita">
                <li class="list-group-item d-flex justify-content-between">
                    <span>Comercio:</span> <strong>Veterinaria San Marcos</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>Servicio:</span> <strong id="pagoServicio">Cargando...</strong>
                </li>
                <li class="list-group-item d-flex justify-content-between">
                    <span>Paciente:</span> <strong id="pagoMascota">Cargando...</strong>
                </li>
            </ul>

            <!-- Simulación de monto -->
            <p class="text-center text-muted mb-0">Monto total a pagar:</p>
            <div class="precio-destacado" id="pagoMonto">$25.000</div>

            <button type="button" class="btn btn-success w-100 btn-lg mt-2" id="btnSimularPago">
                Pagar con Tarjeta
            </button>
            <a href="index.html" class="btn btn-outline-secondary w-100 mt-3" id="btnCancelar">Cancelar y volver</a>

            <!-- Spinner de carga -->
            <div class="loader" id="pantallaCarga">
                <div class="spinner-border text-danger" role="status">
                    <span class="visually-hidden">Procesando...</span>
                </div>
                <p class="mt-2 fw-bold text-muted">Procesando transacción con su banco...</p>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>



</body>


</html>
